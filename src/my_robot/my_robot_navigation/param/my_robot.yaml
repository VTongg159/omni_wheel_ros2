amcl:
  ros__parameters:
    use_sim_time: false
    min_particles: 500
    max_particles: 2000
    kld_err: 0.05
    kld_z: 0.99
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.1
    laser_model_type: likelihood_field
    laser_z_hit: 0.95
    laser_z_rand: 0.05
    laser_sigma_hit: 0.2
    laser_lambda_short: 0.1
    laser_z_short: 0.1
    laser_z_max: 0.05
    laser_z_outlier: 0.05
    pf_err: 0.05
    pf_z: 0.99
    odom_frame_id: odom
    base_frame_id: base_footprint
    global_frame_id: map
    scan_topic: scan
    use_map_topic: false
    update_min_d: 0.2
    update_min_a: 0.2
    transform_tolerance: 1.0
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1
    save_pose_rate: 0.5

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""
    subscribe_to_updates: false

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 20.0
    planner_plugin_ids:
      - GridBased
    planner_plugins:
      - GridBased
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false

controller_server:
  ros__parameters:
    use_sim_time: false
    expected_control_frequency: 20.0
    controller_plugin_ids:
      - FollowPath
    controller_plugins:
      - FollowPath
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller/RegulatedPurePursuitController"
      min_x_velocity_threshold: 0.05
      desired_linear_speed: 0.20
      lookahead_time: 1.0
      lookahead_distance: 0.60
      max_angular_velocity: 1.0
      min_angular_velocity: 0.20
      transform_tolerance: 0.5

bt_navigator:
  ros__parameters:
    use_sim_time: false
    bt_xml_filename: "behavior_trees/navigate_w_replanning_and_recovery.xml"

waypoint_follower:
  ros__parameters:
    use_sim_time: false

global_costmap:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    update_frequency: 1.0
    publish_frequency: 1.0
    transform_tolerance: 0.5
    resolution: 0.05
    footprint:
      - [0.30, 0.30]
      - [0.30, -0.30]
      - [-0.30, -0.30]
      - [-0.30, 0.30]
    plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"
      map_subscribe_transient_local: true
    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      observation_sources: scan
      scan:
        topic: scan
        sensor_frame: base_scan
        data_type: LaserScan
        expected_update_rate: 20.0
        observation_persistence: 0.0
        marking: true
        clearing: true
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      inflation_radius: 0.20

local_costmap:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_footprint
    update_frequency: 5.0
    publish_frequency: 2.0
    transform_tolerance: 0.5
    resolution: 0.05
    static_map: false
    footprint:
      - [0.30, 0.30]
      - [0.30, -0.30]
      - [-0.30, -0.30]
      - [-0.30, 0.30]
    plugins:
      - obstacle_layer
      - inflation_layer
    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      observation_sources: scan
      scan:
        topic: scan
        sensor_frame: base_scan
        data_type: LaserScan
        expected_update_rate: 20.0
        observation_persistence: 0.0
        marking: true
        clearing: true
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      inflation_radius: 0.14
