slam_gmapping:
  ros__parameters:
    # Frames & Topics
    base_frame: "base_link"
    map_frame: "map"
    odom_frame: "odom"
    scan_topic: "scan" 

    # Map update
    map_update_interval: 1.0          
    transform_publish_period: 0.05   
    transform_tolerance: 0.1

    # Laser model
    maxRange: 8.0                     
    maxUrange: 6.5                   
    sigma: 0.05
    kernelSize: 1
    lstep: 0.05
    astep: 0.05
    iterations: 5
    lsigma: 0.075
    ogain: 3.0
    lskip: 0

    # Motion model 
    srr: 0.1
    srt: 0.2
    str: 0.1
    stt: 0.2
    linearUpdate: 0.2              
    angularUpdate: 0.2                
    temporalUpdate: 2.0               
    resampleThreshold: 0.5

    # Particles
    particles: 40                     

    # Map extent 
    xmin: -50.0
    ymin: -50.0
    xmax: 50.0
    ymax: 50.0
    delta: 0.05                    

    # Threshold
    occ_thresh: 0.25
    llsamplerange: 0.01
    llsamplestep: 0.01
    lasamplerange: 0.005
    lasamplestep: 0.005